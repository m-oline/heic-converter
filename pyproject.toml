[project]
name = "heic-converter"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "pillow>=12.2.0",
    "pillow-heif>=1.3.0",
]

[project.scripts]
heic-converter = "main:main"

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["main"]